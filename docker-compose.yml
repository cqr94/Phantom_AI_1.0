version: '3.8'

services:
  # --- GRAPH DATABASE ---
  neo4j:
    image: neo4j:5.12-community
    container_name: phantom_ontolocy_neo4j
    ports:
      - "8474:7474"
      - "8687:7687"
    environment:
      - NEO4J_AUTH=none
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs

  # --- RELATIONAL DATABASE ---
  postgres:
    image: postgres:15-alpine
    container_name: phantom_postgres
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # --- CACHE ---
  redis:
    image: redis:7-alpine
    container_name: phantom_redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data



  # --- PYTHON BACKEND (FastAPI) ---
  backend:
    build:
      context: .
    container_name: phantom_backend
    ports:
      - "8070:8000"
    depends_on:
      - neo4j
      - postgres
      - redis
    env_file:
      - .env
    volumes:
      - .:/app

  # --- VITE REACT FRONTEND ---
  frontend:
    build:
      context: ./frontend/chat_threat
    container_name: phantom_frontend
    ports:
      - "3000:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend/chat_threat:/app
      - /app/node_modules

volumes:
  neo4j_data:
  neo4j_logs:
  postgres_data:
  redis_data:
